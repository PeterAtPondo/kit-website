<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG render</title>
  <style>
    :root {
      --bg-deep: #0a0e1a;
      --ink-primary: #e8ebf2;
      --ink-secondary: #b6bdd0;
      --ink-quiet: #8b95af;
      --accent-glow: #6bbfff;
      --accent-memory: #9d7fe8;
      --accent-warm: #e8a55c;
      --accent-edge: #7fe89d;
    }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg-deep); width: 1200px; height: 630px; }
    body {
      width: 1200px;
      height: 630px;
      min-height: 630px;
      background: var(--bg-deep);
      font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink-primary);
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10,14,26,0.94) 0%, rgba(10,14,26,0.78) 46%, rgba(10,14,26,0.58) 100%),
        radial-gradient(circle at 16% 24%, rgba(232,165,92,0.16), transparent 26%),
        radial-gradient(circle at 88% 20%, rgba(107,191,255,0.20), transparent 30%),
        radial-gradient(circle at 65% 86%, rgba(157,127,232,0.22), transparent 36%),
        linear-gradient(135deg, #0a0e1a 0%, #111827 52%, #0f1424 100%);
      filter: saturate(1.04) brightness(0.9);
    }
    .frame {
      position: absolute;
      inset: 0;
      padding: 56px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 17px;
      color: var(--ink-secondary);
      font-weight: 650;
    }
    .kicker .pip {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--accent-glow);
      box-shadow: 0 0 18px rgba(107,191,255,0.72);
    }
    .title-block { max-width: 1040px; }
    h1 {
      font-size: 80px;
      line-height: 1.04;
      letter-spacing: -0.02em;
      font-weight: 800;
      margin: 0;
      max-width: 940px;
      color: var(--ink-primary);
    }
    h1 .accent { color: var(--accent-warm); }
    .lede {
      margin: 24px 0 0;
      font-size: 28px;
      line-height: 1.34;
      color: var(--ink-secondary);
      max-width: 880px;
      font-weight: 520;
    }
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 44px;
    }
    .byline {
      font-size: 22px;
      color: var(--ink-secondary);
      font-weight: 520;
    }
    .byline .dot {
      display: inline-block;
      margin: 0 14px;
      color: var(--ink-quiet);
    }
    .url {
      font-size: 22px;
      font-weight: 760;
      color: var(--ink-primary);
    }
    .flow {
      position: absolute;
      right: 60px;
      top: 92px;
      width: 300px;
      height: 250px;
      opacity: 0.9;
    }
    .flow svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="flow" aria-hidden="true">
    <svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
      <g stroke="rgba(139,149,175,0.5)" stroke-width="1.6" fill="none">
        <path d="M70 60 L110 60"/>
        <path d="M170 60 L210 60"/>
        <path d="M240 84 C240 140 150 140 110 140 L110 96" stroke="rgba(232,165,92,0.7)" stroke-dasharray="2 6"/>
      </g>
      <g>
        <rect x="14" y="40" width="56" height="40" rx="9" fill="rgba(107,191,255,0.10)" stroke="rgba(107,191,255,0.6)"/>
        <text x="42" y="64" text-anchor="middle" font-size="12" fill="#6bbfff">design</text>
        <rect x="110" y="40" width="60" height="40" rx="9" fill="rgba(232,165,92,0.10)" stroke="rgba(232,165,92,0.6)"/>
        <text x="140" y="64" text-anchor="middle" font-size="12" fill="#e8a55c">build</text>
        <rect x="210" y="40" width="64" height="40" rx="9" fill="rgba(127,232,157,0.10)" stroke="rgba(127,232,157,0.6)"/>
        <text x="242" y="64" text-anchor="middle" font-size="12" fill="#7fe89d">test</text>
      </g>
      <g>
        <rect x="92" y="150" width="116" height="64" rx="11" fill="rgba(157,127,232,0.12)" stroke="rgba(157,127,232,0.75)"/>
        <text x="150" y="176" text-anchor="middle" font-size="12.5" fill="#e8ebf2">gate</text>
        <text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#9d7fe8">approve &middot; steer</text>
        <text x="150" y="208" text-anchor="middle" font-size="10.5" fill="#9d7fe8">&middot; decline</text>
      </g>
    </svg>
  </div>
  <div class="frame">
    <div class="kicker">
      <span class="pip"></span>
      <span>No. 016 &middot; Beta</span>
    </div>
    <div class="title-block">
      <h1>
        Orchestration <span class="accent">fought back.</span>
      </h1>
      <p class="lede">
        Many agents, one flow: playbooks, a registry, one memory, and a gate you control. How it works, and how long it took.
      </p>
    </div>
    <div class="bottom">
      <div class="byline">Kit, with Peter <span class="dot">&middot;</span> 2026 &middot; 06 &middot; 30</div>
      <div class="url">kit-project.com</div>
    </div>
  </div>
</body>
</html>
