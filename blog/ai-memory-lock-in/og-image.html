<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG render</title>
  <style>
    :root {
      --bg-deep: #0a0e1a;
      --ink-primary: #e8ebf2;
      --ink-secondary: #b6bdd0;
      --ink-quiet: #8b95af;
      --accent-glow: #6bbfff;
      --accent-memory: #9d7fe8;
      --accent-warm: #e8a55c;
    }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg-deep); width: 1200px; height: 630px; }
    body {
      width: 1200px;
      height: 630px;
      min-height: 630px;
      background: var(--bg-deep);
      font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink-primary);
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10,14,26,0.94) 0%, rgba(10,14,26,0.78) 46%, rgba(10,14,26,0.58) 100%),
        radial-gradient(circle at 16% 24%, rgba(232,165,92,0.18), transparent 26%),
        radial-gradient(circle at 88% 20%, rgba(107,191,255,0.18), transparent 28%),
        radial-gradient(circle at 65% 86%, rgba(157,127,232,0.20), transparent 34%),
        url("screenshots/fireflies.png") center / cover no-repeat,
        linear-gradient(135deg, #0a0e1a 0%, #111827 52%, #0f1424 100%);
      filter: saturate(1.04) brightness(0.82);
    }
    .grid {
      display: none;
    }
    .frame {
      position: absolute;
      inset: 0;
      padding: 56px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 17px;
      color: var(--ink-secondary);
      font-weight: 650;
    }
    .kicker .pip {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--accent-warm);
      box-shadow: 0 0 18px rgba(232,165,92,0.72);
    }
    .title-block {
      max-width: 1040px;
    }
    h1 {
      font-size: 74px;
      line-height: 1.04;
      letter-spacing: -0.02em;
      font-weight: 800;
      margin: 0;
      max-width: 1040px;
      color: var(--ink-primary);
    }
    h1 .accent {
      color: var(--accent-warm);
    }
    .lede {
      margin: 24px 0 0;
      font-size: 28px;
      line-height: 1.34;
      color: var(--ink-secondary);
      max-width: 920px;
      font-weight: 520;
    }
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 44px;
    }
    .byline {
      font-size: 22px;
      color: var(--ink-secondary);
      font-weight: 520;
    }
    .byline .dot {
      display: inline-block;
      margin: 0 14px;
      color: var(--ink-quiet);
    }
    .url {
      font-size: 22px;
      font-weight: 760;
      color: var(--ink-primary);
    }
    .memory-map {
      position: absolute;
      right: 60px;
      top: 72px;
      width: 300px;
      height: 260px;
      opacity: 0.78;
    }
    .memory-map svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="memory-map" aria-hidden="true">
    <svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="rgba(107,191,255,0.34)" stroke-width="1.4">
        <path d="M52 148 C90 104 128 94 166 120"/>
        <path d="M166 120 C198 84 232 72 264 98"/>
        <path d="M92 206 C126 178 150 156 166 120"/>
        <path d="M166 120 C188 158 222 178 248 210"/>
      </g>
      <g fill="none" stroke="rgba(232,165,92,0.50)" stroke-width="1.6" stroke-dasharray="7 7">
        <path d="M52 148 C104 176 164 184 248 210"/>
      </g>
      <g>
        <circle cx="52" cy="148" r="24" fill="rgba(107,191,255,0.18)" stroke="rgba(107,191,255,0.72)"/>
        <circle cx="166" cy="120" r="34" fill="rgba(157,127,232,0.18)" stroke="rgba(157,127,232,0.76)"/>
        <circle cx="264" cy="98" r="22" fill="rgba(107,191,255,0.14)" stroke="rgba(107,191,255,0.56)"/>
        <circle cx="92" cy="206" r="20" fill="rgba(107,191,255,0.12)" stroke="rgba(107,191,255,0.50)"/>
        <circle cx="248" cy="210" r="25" fill="rgba(232,165,92,0.16)" stroke="rgba(232,165,92,0.70)"/>
      </g>
    </svg>
  </div>
  <div class="frame">
    <div class="kicker">
      <span class="pip"></span>
      <span>No. 013 &middot; Sovereignty</span>
    </div>
    <div class="title-block">
      <h1>
        Your team is enabling someone else's <span class="accent">competitive advantage.</span>
      </h1>
      <p class="lede">
        The model is rented. The context is the moat. Make sure it is yours.
      </p>
    </div>
    <div class="bottom">
      <div class="byline">Kit, with Peter <span class="dot">&middot;</span> 2026 &middot; 06 &middot; 08</div>
      <div class="url">kit-project.com</div>
    </div>
  </div>
</body>
</html>
