<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0a0e1a;width:1300px;}
  .wrap{width:1300px;padding:40px 0;background:#0a0e1a;}
  svg{display:block;width:1300px;height:auto;font-family:Manrope,-apple-system,sans-serif;}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;}
</style></head><body>
<div class="wrap">
<svg viewBox="0 0 1300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The coding-workflow playbook. A trigger starts a run that moves through Designer, Architect, Builder, and Tester roles into a human approval gate, which can approve and ship, decline to leave it on the branch, or refine and send it back to the builder.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b95af"/></marker>
    <marker id="arrw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e8a55c"/></marker>
  </defs>

  <!-- refine loop: gate back to builder, under the row -->
  <path d="M963,214 C963,330 720,330 582,330 C560,330 560,300 560,214" fill="none" stroke="#e8a55c" stroke-width="1.8" stroke-dasharray="2 7" opacity="0.8" marker-end="url(#arrw)"/>
  <text x="690" y="322" text-anchor="middle" class="mono" font-size="13" fill="#e8a55c" opacity="0.95">refine, back to the builder (rework++)</text>

  <!-- row connectors -->
  <g stroke="#8b95af" stroke-width="1.8" fill="none" opacity="0.55">
    <line x1="132" y1="158" x2="146" y2="158" marker-end="url(#arr)"/>
    <line x1="310" y1="158" x2="322" y2="158" marker-end="url(#arr)"/>
    <line x1="486" y1="158" x2="498" y2="158" marker-end="url(#arr)"/>
    <line x1="662" y1="158" x2="674" y2="158" marker-end="url(#arr)"/>
    <line x1="838" y1="158" x2="854" y2="158" marker-end="url(#arr)"/>
    <line x1="1068" y1="158" x2="1106" y2="158" marker-end="url(#arr)"/>
  </g>

  <!-- trigger -->
  <g>
    <rect x="10" y="128" width="120" height="60" rx="30" fill="rgba(107,191,255,0.08)" stroke="rgba(107,191,255,0.5)"/>
    <text x="70" y="164" text-anchor="middle" class="mono" font-size="15" fill="#6bbfff">trigger</text>
    <text x="70" y="210" text-anchor="middle" class="mono" font-size="12" fill="#8b95af">you ask &middot; a message</text>
    <text x="70" y="228" text-anchor="middle" class="mono" font-size="12" fill="#8b95af">&middot; the nightly audit</text>
  </g>

  <!-- role boxes -->
  <!-- Designer -->
  <g>
    <rect x="150" y="110" width="160" height="96" rx="14" fill="rgba(20,25,38,0.75)" stroke="rgba(107,191,255,0.55)"/>
    <circle cx="172" cy="140" r="4" fill="#6bbfff"/>
    <text x="186" y="145" font-size="19" fill="#e8ebf2">Designer</text>
    <text x="168" y="176" class="mono" font-size="12.5" fill="#8b95af">Forest</text>
    <text x="168" y="194" class="mono" font-size="11.5" fill="#5f6b85">Claude Code</text>
  </g>
  <!-- Architect -->
  <g>
    <rect x="326" y="110" width="160" height="96" rx="14" fill="rgba(20,25,38,0.75)" stroke="rgba(107,191,255,0.55)"/>
    <circle cx="348" cy="140" r="4" fill="#6bbfff"/>
    <text x="362" y="145" font-size="19" fill="#e8ebf2">Architect</text>
    <text x="344" y="176" class="mono" font-size="12.5" fill="#8b95af">Forest</text>
    <text x="344" y="194" class="mono" font-size="11.5" fill="#5f6b85">Claude Code</text>
  </g>
  <!-- Builder -->
  <g>
    <rect x="502" y="110" width="160" height="96" rx="14" fill="rgba(20,25,38,0.75)" stroke="rgba(232,165,92,0.6)"/>
    <circle cx="524" cy="140" r="4" fill="#e8a55c"/>
    <text x="538" y="145" font-size="19" fill="#e8ebf2">Builder</text>
    <text x="520" y="176" class="mono" font-size="12.5" fill="#8b95af">Taz</text>
    <text x="520" y="194" class="mono" font-size="11.5" fill="#5f6b85">Codex &middot; on a branch</text>
  </g>
  <!-- Tester -->
  <g>
    <rect x="678" y="110" width="160" height="96" rx="14" fill="rgba(20,25,38,0.75)" stroke="rgba(127,232,157,0.55)"/>
    <circle cx="700" cy="140" r="4" fill="#7fe89d"/>
    <text x="714" y="145" font-size="19" fill="#e8ebf2">Tester</text>
    <text x="696" y="176" class="mono" font-size="12.5" fill="#8b95af">Deforest</text>
    <text x="696" y="194" class="mono" font-size="11.5" fill="#5f6b85">headless Claude Code</text>
  </g>

  <!-- gate -->
  <g>
    <rect x="858" y="104" width="210" height="108" rx="14" fill="rgba(157,127,232,0.10)" stroke="rgba(157,127,232,0.7)"/>
    <text x="876" y="132" font-size="17" fill="#e8ebf2">approval gate</text>
    <text x="876" y="151" class="mono" font-size="11.5" fill="#8b95af">your call &middot; via Telegram</text>
    <g class="mono" font-size="12.5">
      <rect x="876" y="166" width="58" height="28" rx="8" fill="none" stroke="#7fe89d" opacity="0.8"/>
      <text x="905" y="184" text-anchor="middle" fill="#7fe89d">approve</text>
      <rect x="942" y="166" width="54" height="28" rx="8" fill="none" stroke="#8b95af" opacity="0.7"/>
      <text x="969" y="184" text-anchor="middle" fill="#8b95af">decline</text>
      <rect x="1004" y="166" width="48" height="28" rx="8" fill="none" stroke="#e8a55c" opacity="0.8"/>
      <text x="1028" y="184" text-anchor="middle" fill="#e8a55c">refine</text>
    </g>
  </g>

  <!-- ship -->
  <g>
    <rect x="1110" y="128" width="120" height="60" rx="14" fill="rgba(127,232,157,0.10)" stroke="rgba(127,232,157,0.6)"/>
    <text x="1170" y="164" text-anchor="middle" font-size="18" fill="#7fe89d">ship</text>
    <text x="1170" y="210" text-anchor="middle" class="mono" font-size="11.5" fill="#8b95af">merge &amp; deploy</text>
  </g>
</svg>
</div>
</body></html>
